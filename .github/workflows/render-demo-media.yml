name: Render demo media

on:
  workflow_dispatch:
    inputs:
      output_dir:
        description: Directory where the rendered MP3 and MP4 will be written
        required: false
        default: rendered_demo
      artifact_name:
        description: Name of the downloadable GitHub Actions artifact
        required: false
        default: krbl-demo-media
  push:
    paths:
      - app.py
      - demo_media/**
      - scripts/render_*.py
      - requirements.txt
      - .github/workflows/render-demo-media.yml

permissions:
  contents: read

jobs:
  render-media:
    name: Render MP3 narration and MP4 demo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Render narration MP3 and demo MP4
        run: python scripts/render_demo.py --output-dir "${{ inputs.output_dir || 'rendered_demo' }}"

      - name: List rendered files
        run: find "${{ inputs.output_dir || 'rendered_demo' }}" -maxdepth 2 -type f -print

      - name: Upload downloadable media artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name || 'krbl-demo-media' }}
          path: |
            ${{ inputs.output_dir || 'rendered_demo' }}/krbl_narration.mp3
            ${{ inputs.output_dir || 'rendered_demo' }}/krbl_streamlit_demo.mp4
          if-no-files-found: error
          retention-days: 14
